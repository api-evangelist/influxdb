    TemplateApply:
      properties:
        actions:
          description: "A list of `action` objects.\nActions let you customize how InfluxDB applies templates in the request.\n\nYou can use the following actions to prevent creating or updating resources:\n\n- A `skipKind` action skips template resources of a specified `kind`.\n- A `skipResource` action skips template resources with a specified `metadata.name`\n  and `kind`.\n"
          items:
            oneOf:
            - properties:
                action:
                  enum:
                  - skipKind
                  type: string
                properties:
                  properties:
                    kind:
                      $ref: '#/components/schemas/TemplateKind'
                  required:
                  - kind
                  type: object
              type: object
            - properties:
                action:
                  enum:
                  - skipResource
                  type: string
                properties:
                  properties:
                    kind:
                      $ref: '#/components/schemas/TemplateKind'
                    resourceTemplateName:
                      type: string
                  required:
                  - kind
                  - resourceTemplateName
                  type: object
              type: object
          type: array
        dryRun:
          description: 'Only applies a dry run of the templates passed in the request.


            - Validates the template and generates a resource diff and summary.

            - Doesn''t install templates or make changes to the InfluxDB instance.

            '
          type: boolean
        envRefs:
          additionalProperties:
            oneOf:
            - type: string
            - type: integer
            - type: number
            - type: boolean
          description: "An object with key-value pairs that map to **environment references** in templates.\n\nEnvironment references in templates are `envRef` objects with an `envRef.key`\nproperty.\nTo substitute a custom environment reference value when applying templates,\npass `envRefs` with the `envRef.key` and the value.\n\nWhen you apply a template, InfluxDB replaces `envRef` objects in the template\nwith the values that you provide in the `envRefs` parameter.\nFor more examples, see how to [define environment references](https://docs.influxdata.com/influxdb/cloud/influxdb-templates/use/#define-environment-references).\n\nThe following template fields may use environment references:\n\n  - `metadata.name`\n  - `spec.endpointName`\n  - `spec.associations.name`\n\nFor more information about including environment references in template fields, see how to\n[include user-definable resource names](https://docs.influxdata.com/influxdb/cloud/influxdb-templates/create/#include-user-definable-resource-names).\n"
          type: object
        orgID:
          description: 'Organization ID.

            InfluxDB applies templates to this organization.

            The organization owns all resources created by the template.


            To find your organization, see how to

            [view organizations](https://docs.influxdata.com/influxdb/cloud/organizations/view-orgs/).

            '
          type: string
        remotes:
          description: 'A list of URLs for template files.


            To apply a template manifest file located at a URL, pass `remotes`

            with an array that contains the URL.

            '
          items:
            properties:
              contentType:
                type: string
              url:
                type: string
            required:
            - url
            type: object
          type: array
        secrets:
          additionalProperties:
            type: string
          description: "An object with key-value pairs that map to **secrets** in queries.\n\nQueries may reference secrets stored in InfluxDB--for example,\nthe following Flux script retrieves `POSTGRES_USERNAME` and `POSTGRES_PASSWORD`\nsecrets and then uses them to connect to a PostgreSQL database:\n\n```js\nimport \"sql\"\nimport \"influxdata/influxdb/secrets\"\n\nusername = secrets.get(key: \"POSTGRES_USERNAME\")\npassword = secrets.get(key: \"POSTGRES_PASSWORD\")\n\nsql.from(\n  driverName: \"postgres\",\n  dataSourceName: \"postgresql://${username}:${password}@localhost:5432\",\n  query: \"SELECT * FROM example_table\",\n)\n```\n\nTo define secret values in your `/api/v2/templates/apply` request,\npass the `secrets` parameter with key-value pairs--for example:\n\n```json\n{\n  ...\n  \"secrets\": {\n    \"POSTGRES_USERNAME\": \"pguser\",\n    \"POSTGRES_PASSWORD\": \"foo\"\n  }\n  ...\n}\n```\n\nInfluxDB stores the key-value pairs as secrets that you can access with `secrets.get()`.\nOnce stored, you can't view secret values in InfluxDB.\n\n#### Related guides\n\n- [How to pass secrets when installing a template](https://docs.influxdata.com/influxdb/cloud/influxdb-templates/use/#pass-secrets-when-installing-a-template)\n"
          type: object
        stackID:
          description: 'ID of the stack to update.


            To apply templates to an existing stack in the organization, use the `stackID` parameter.

            If you apply templates without providing a stack ID,

            InfluxDB initializes a new stack with all new resources.


            To find a stack ID, use the InfluxDB [`/api/v2/stacks` API endpoint](#operation/ListStacks) to list stacks.


            #### Related guides


            - [Stacks](https://docs.influxdata.com/influxdb/cloud/influxdb-templates/stacks/)

            - [View stacks](https://docs.influxdata.com/influxdb/cloud/influxdb-templates/stacks/view/)

            '
          type: string
        template:
          description: 'A template object to apply.

            A template object has a `contents` property

            with an array of InfluxDB resource configurations.


            Pass `template` to apply only one template object.

            If you use `template`, you can''t use the `templates` parameter.

            If you want to apply multiple template objects, use `templates` instead.

            '
          properties:
            contentType:
              type: string
            contents:
              $ref: '#/components/schemas/Template'
            sources:
              items:
                type: string
              type: array
          type: object
        templates:
          description: 'A list of template objects to apply.

            A template object has a `contents` property

            with an array of InfluxDB resource configurations.


            Use the `templates` parameter to apply multiple template objects.

            If you use `templates`, you can''t use the `template` parameter.

            '
          items:
            properties:
              contentType:
                type: string
              contents:
                $ref: '#/components/schemas/Template'
              sources:
                items:
                  type: string
                type: array
            type: object
          type: array
      type: object
