        description: 'A template entry.

          Defines an InfluxDB resource in a template.

          '
        properties:
          apiVersion:
            example: influxdata.com/v2alpha1
            type: string
          kind:
            $ref: '#/components/schemas/TemplateKind'
          metadata:
            description: 'Metadata properties used for the resource when the template is applied.

              '
            properties:
              name:
                type: string
            type: object
          spec:
            description: "Configuration properties used for the resource when the template is applied.\nKey-value pairs map to the specification for the resource.\n\nThe following code samples show `spec` configurations for template resources:\n\n- A bucket:\n\n```json\n{ \"spec\": {\n    \"name\": \"iot_center\",\n    \"retentionRules\": [{\n        \"everySeconds\": 2.592e+06,\n        \"type\": \"expire\"\n      }]\n  }\n}\n```\n\n- A variable:\n\n```json\n{ \"spec\": {\n    \"language\": \"flux\",\n    \"name\": \"Node_Service\",\n    \"query\": \"import \\\"influxdata/influxdb/v1\\\"\\r\\nv1.tagValues(bucket: \\\"iot_center\\\",\n        tag: \\\"service\\\")\",\n    \"type\": \"query\"\n  }\n}\n```\n"
            type: object
        type: object
      type: array
